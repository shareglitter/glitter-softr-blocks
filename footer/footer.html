<script>
(function() {
  var spinner = document.getElementById('loading-spinner');
  var maxWait = 5000;
  var checkInterval = 200;
  var contentAppeared = false;

  function hideSpinner() {
    if (spinner) spinner.style.display = 'none';
  }

  var safety = setTimeout(hideSpinner, maxWait);

  function checkPage() {
    var content = document.getElementById('main-content');
    if (!content) return;
    var text = content.textContent || '';
    var hasTags = /\{[A-Za-z0-9_ ()\-]+\}/.test(text);

    // Phase 1: wait until we see merge tags (blocks have rendered)
    if (!contentAppeared && hasTags) {
      contentAppeared = true;
      return;
    }

    // Phase 2: once we saw tags, wait until they're all replaced
    if (contentAppeared && !hasTags) {
      setTimeout(function() {
        hideSpinner();
        clearTimeout(safety);
      }, 300);
      clearInterval(poll);
    }
  }

  var poll = setInterval(checkPage, checkInterval);
})();
</script>
