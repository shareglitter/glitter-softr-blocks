

<style>
  /* Hides the list-details-blocks block */
 #blockdata {
  visibility: hidden !important;
  height: 0 !important;
  overflow: hidden !important;
  position: absolute !important;
  pointer-events: none !important;
}
  
  #grid6 {
  visibility: hidden !important;
  height: 0 !important;
  overflow: hidden !important;
  position: absolute !important;
  pointer-events: none !important;
}
  
  /* Keep every placeholder inline */
  .block-headline * { display:inline !important; }

  /* Prevent internal breaks only inside street names */
  .data-primary-street,
  .data-cross-street-1,
  .data-cross-street-2 { white-space:nowrap; }
  
  
#loading-spinner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: white;
  opacity: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#loading-spinner i {
  font-size: 60px;
  color: #000000;
}
</style>

<script>
  (function() {
    var maxAttempts = 40;
    var attempt = 0;
    function tryScrapingFields() {
      attempt++;
      var block = document.querySelector('#blockdata');
      if (!block) {
        if (attempt < maxAttempts) setTimeout(tryScrapingFields, 500);
        return;
      }
      var wrappers = block.querySelectorAll('.label-wrapper');
      var record = {};
      var foundFields = 0;
      wrappers.forEach(function(wrapper) {
        var labelEl = wrapper.querySelector('p');
        if (!labelEl) return;
        var label = labelEl.textContent.trim();
        if (!label) return;
        var valueEl = wrapper.querySelector('.list-field-element');
        if (!valueEl) return;
        var img = wrapper.querySelector('img');
        if (img && img.getAttribute('src') && img.getAttribute('src').indexOf('http') === 0) {
          record[label] = img.getAttribute('src');
          foundFields++;
        } else {
          var val = valueEl.textContent.trim();
          if (val) {
            record[label] = val;
            foundFields++;
          }
        }
      });
      if (foundFields < 3 && attempt < maxAttempts) {
        setTimeout(tryScrapingFields, 500);
        return;
      }
      if (foundFields < 3) {
        console.log('Glitter helper: gave up after ' + maxAttempts + ' attempts, found ' + foundFields + ' fields');
        return;
      }
      console.log('Glitter helper: scraped ' + foundFields + ' fields on attempt ' + attempt);

      // Format ISO dates to readable format
      Object.keys(record).forEach(function(key) {
        var val = record[key];
        if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(val)) {
          var d = new Date(val);
          if (!isNaN(d.getTime())) {
            record[key] = d.toLocaleDateString('en-US', {
              month: 'long',
              day: 'numeric',
              year: 'numeric'
            });
          }
        }
      });

      // Extract actual URLs from Softr's "filename (url)" format
      Object.keys(record).forEach(function(key) {
        var val = record[key];
        if (typeof val === 'string' && val.indexOf('(https://') !== -1) {
          var match = val.match(/\(https?:\/\/[^\)]+\)/);
          if (match) {
            record[key] = match[0].slice(1, -1);
          }
        }
      });

      console.log('Glitter helper: fields', record);

      // Replace {Field Name} placeholders
      function replacePlaceholders(el) {
        var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while (node = walker.nextNode()) {
          var text = node.nodeValue;
          if (text && text.indexOf('{') !== -1) {
            var replaced = text.replace(/\{([^}]+)\}/g, function(match, fieldName) {
              var value = record[fieldName];
              return (value !== undefined && value !== '') ? value : match;
            });
            if (replaced !== text) node.nodeValue = replaced;
          }
        }
      }

      // Replace data-glitter-field elements
      document.querySelectorAll('[data-glitter-field]').forEach(function(el) {
        var fieldName = el.getAttribute('data-glitter-field');
        var value = record[fieldName];
        if (value !== undefined && value !== '') {
          if (el.tagName === 'IMG') el.setAttribute('src', value);
          else el.textContent = value;
        }
      });

      // Run replacements on page
      var allBlocks = document.querySelectorAll('section, [class*="custom-code"], .glitter-mid-section');
      allBlocks.forEach(function(el) {
        if (!block.contains(el) && el.id !== 'blockdata') replacePlaceholders(el);
      });

      window.glitterRecord = record;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(tryScrapingFields, 1000);
      });
    } else {
      setTimeout(tryScrapingFields, 1000);
    }
  })();
</script>
