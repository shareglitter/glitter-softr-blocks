<!--
  ================================================================
  RECENT CLEANINGS CAROUSEL - Softr Custom Code Block
  ================================================================

  WHAT THIS DOES:
  Renders a horizontal carousel of recent cleaning entries, each
  showing a large hero photo + 3 stacked thumbnails + "+N" overflow
  badge + date stamp. Matches the Figma "Block Page" design.

  HOW IT WORKS:
  1. Waits for the hidden #grid6 Softr List block to render
  2. Scrapes image URLs and date text from each card in that block
  3. Builds the carousel HTML dynamically
  4. Arrow buttons scroll the carousel horizontally

  DEPENDENCIES:
  - #grid6 must exist on the page and be connected to the Cleaning
    Log table in Airtable (it's hidden via footer CSS but still
    renders its data into the DOM)
  - The #grid6 block must have the Photos and Date fields visible

  SETUP IN SOFTR:
  1. Add the CSS in "--- FOOTER CSS ---" section below to your
     page's Settings > Custom Code > Code inside footer
  2. Add a new Custom Code block to the page, positioned where the
     old Latest Cleanups section was
  3. Paste everything between the START/END markers into that block
  4. Keep the original #grid6 block on the page (it will be hidden
     but its data is still scraped)

  TO MAINTAIN:
  - If the Softr block ID changes from "grid6", update the selector
    in the JS below (search for '#grid6')
  - The scraper auto-adapts to however many photos each cleaning has
  - If Softr changes its card DOM structure, the CSS selectors in
    the scraper function may need updating (check console logs)

  DEBUGGING:
  Open browser console and look for lines starting with
  "GC Cleanings:" to see what the scraper found.
  ================================================================
-->

<style>
  .gc-cleanings-section {
    background-color: #0B6669;
    padding: 48px 0 56px;
    position: relative;
    overflow: hidden;
    /* Override Softr's default section max-width */
    max-width: 100vw !important;
    margin-left: calc(-50vw + 50%) !important;
    margin-right: calc(-50vw + 50%) !important;
    width: 100vw !important;
  }

  .gc-cleanings-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* -- Header -- */
  .gc-cleanings-header {
    margin-bottom: 32px;
  }

  .gc-cleanings-title {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 6px 0;
    line-height: 1.2;
    font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .gc-cleanings-link {
    color: #ffffff;
    font-size: 15px;
    text-decoration: none;
    opacity: 0.85;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.2s;
    font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .gc-cleanings-link:hover {
    opacity: 1;
  }

  .gc-cleanings-link svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s;
  }

  .gc-cleanings-link:hover svg {
    transform: translateX(3px);
  }

  /* -- Carousel track -- */
  .gc-cleanings-track-wrapper {
    position: relative;
  }

  .gc-cleanings-track {
    display: flex;
    gap: 32px;
    overflow-x: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
  }

  .gc-cleanings-track::-webkit-scrollbar {
    display: none;
  }

  /* -- Single cleaning entry -- */
  .gc-cleaning-entry {
    flex: 0 0 auto;
    width: 420px;
    min-width: 0;
  }

  .gc-cleaning-photos {
    display: flex;
    gap: 6px;
    height: 280px;
    margin-bottom: 12px;
  }

  /* Large hero image */
  .gc-cleaning-hero {
    flex: 1;
    min-width: 0;
    border-radius: 10px;
    overflow: hidden;

    cursor: pointer;
  }

  .gc-cleaning-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Stacked thumbnails */
  .gc-cleaning-thumbs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 90px;
    flex-shrink: 0;
  }

  .gc-cleaning-thumb {
    flex: 1;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
  }

  .gc-cleaning-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* +N overflow badge */
  .gc-cleaning-overflow {
    position: absolute;
    inset: 0;
    background: rgba(21, 114, 117, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 18px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
  }

  /* Date */
  .gc-cleaning-date {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.4;
    font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Divider between entries */
  .gc-cleaning-entry+.gc-cleaning-entry {
    padding-left: 32px;
    border-left: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* -- Nav arrows -- */
  .gc-cleanings-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    transition: background 0.2s, opacity 0.3s;
    z-index: 2;
  }

  .gc-cleanings-nav:hover {
    background: #ffffff;
  }

  .gc-cleanings-nav svg {
    width: 20px;
    height: 20px;
    color: #352f44;
  }

  .gc-cleanings-nav--left {
    left: -8px;
  }

  .gc-cleanings-nav--right {
    right: -8px;
  }

  .gc-cleanings-nav[disabled] {
    opacity: 0;
    pointer-events: none;
  }

  /* -- Loading state -- */
  .gc-cleanings-loading {
    color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
    padding: 40px 0;
    font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* -- Lightbox -- */
  .gc-lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease;
    cursor: pointer;
  }
  .gc-lightbox-overlay.gc-lb-visible {
    opacity: 1;
  }
  .gc-lightbox-content {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gc-lightbox-content img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    cursor: default;
  }
  .gc-lightbox-close {
    position: absolute;
    top: -40px;
    right: -8px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    line-height: 1;
  }
  .gc-lightbox-close:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  .gc-lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    transition: background 0.2s;
  }
  .gc-lightbox-nav:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  .gc-lightbox-nav svg {
    width: 22px;
    height: 22px;
  }
  .gc-lightbox-prev { left: -60px; }
  .gc-lightbox-next { right: -60px; }
  .gc-lightbox-counter {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-family: 'Epilogue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    white-space: nowrap;
  }

  @media (max-width: 768px) {
    .gc-lightbox-prev { left: 8px; }
    .gc-lightbox-next { right: 8px; }
    .gc-lightbox-close { top: -44px; right: 0; }
    .gc-lightbox-nav {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.25);
    }
  }

  /* -- Responsive -- */
  @media (max-width: 768px) {
    .gc-cleanings-section {
      padding: 36px 0 44px;
    }

    .gc-cleanings-inner {
      padding: 0 20px;
    }

    .gc-cleaning-entry {
      width: 320px;
    }

    .gc-cleaning-photos {
      height: 220px;
    }

    .gc-cleaning-thumbs {
      width: 72px;
    }

    .gc-cleanings-nav {
      display: none;
    }

    .gc-cleanings-title {
      font-size: 24px;
    }
  }
</style>

<div class="gc-cleanings-section">
  <div class="gc-cleanings-inner">

    <div class="gc-cleanings-header">
      <h2 class="gc-cleanings-title">Recent Cleanings</h2>
      <a href="/log" class="gc-cleanings-link">
        View cleaning log
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </a>
    </div>

    <div class="gc-cleanings-track-wrapper">
      <button class="gc-cleanings-nav gc-cleanings-nav--left" disabled aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="gc-cleanings-track" id="gcCleaningsTrack">
        <div class="gc-cleanings-loading">Loading recent cleanings...</div>
      </div>

      <button class="gc-cleanings-nav gc-cleanings-nav--right" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
  (function() {
  /* ============================================================
     CONFIG - Update these if your Softr block IDs change
     ============================================================ */
  var SOURCE_BLOCK_ID = 'grid6';    // The hidden Softr List block
  var MAX_ATTEMPTS = 40;            // Poll up to 20 seconds
  var POLL_INTERVAL = 500;          // Check every 500ms
  var MAX_THUMBS = 3;               // Show 3 thumbnails in the stack
  var CLEANING_LOG_URL = '/log'; // Link target

  /* ============================================================
     LIGHTBOX STATE
     ============================================================ */
  var lightboxImages = [];  // Images for the CURRENT cleaning entry only
  var lightboxIndex = 0;
  var lightboxOverlay = null;
  var allEntryImages = []; // Array of arrays: each sub-array is one cleaning entry's images

  /* ============================================================
     SCRAPER - Extracts cleaning data from the hidden Softr block
     ============================================================ */
  var attempt = 0;

  function scrapeCleanings() {
    attempt++;
    var block = document.getElementById(SOURCE_BLOCK_ID);

    if (!block) {
      if (attempt < MAX_ATTEMPTS) setTimeout(scrapeCleanings, POLL_INTERVAL);
      else console.log('GC Cleanings: #' + SOURCE_BLOCK_ID + ' not found after ' + MAX_ATTEMPTS + ' attempts');
      return;
    }

    /*
     * Softr List blocks render each record as a card.
     * We look for common card container patterns.
     * The selectors below cover Softr's Grid and Horizontal Card layouts.
     * If none match, we fall back to looking for any direct child divs.
     */
    var cards = block.querySelectorAll('.card-wrapper, .list-card-wrapper, .swiper-slide, [class*="card"]');

    // Fallback: if no known card classes, try direct children of the list container
    if (cards.length === 0) {
      var listContainer = block.querySelector('.list-container, .cards-container, .swiper-wrapper, [class*="list"]');
      if (listContainer) {
        cards = listContainer.children;
      }
    }

    // Still nothing? Try broader search
    if (cards.length === 0) {
      cards = block.querySelectorAll('a[href], div > div > div');
    }

    console.log('GC Cleanings: attempt ' + attempt + ', found ' + cards.length + ' potential card elements');

    // Need at least 1 card with images to proceed
    var cleanings = [];

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var imgs = card.querySelectorAll('img');
      var imageUrls = [];

      for (var j = 0; j < imgs.length; j++) {
        var src = imgs[j].getAttribute('src') || '';
        // Skip tiny icons, avatars, logos, placeholders
        if (src && src.indexOf('http') === 0 && !src.includes('placeholder') && !src.includes('icon')) {
          // Skip very small images (likely UI elements)
          var w = imgs[j].naturalWidth || imgs[j].width || 100;
          if (w > 30 || w === 0) { // 0 means not loaded yet, include it
            imageUrls.push(src);
          }
        }
      }

      if (imageUrls.length === 0) continue;

      // Deduplicate (Softr sometimes renders the same image in carousel + thumbnail)
      var seen = {};
      var uniqueUrls = [];
      imageUrls.forEach(function(url) {
        // Normalize URL by removing size params for dedup
        var key = url.split('?')[0];
        if (!seen[key]) {
          seen[key] = true;
          uniqueUrls.push(url);
        }
      });

      // Extract date text - look for date-like strings in the card
      var dateText = '';
      var textEls = card.querySelectorAll('p, span, div, time');
      for (var k = 0; k < textEls.length; k++) {
        var t = textEls[k].textContent.trim();
        // Match date patterns like "Jul 23rd, 2026 07:57 AM" or "2026-07-23"
        if (t && (
          /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i.test(t) ||
          /\d{4}-\d{2}-\d{2}/.test(t)
        )) {
          dateText = t;
          break;
        }
      }

      // Format the date to match Figma style: "July 23, 2026 at 7:57am"
      dateText = formatCleaningDate(dateText);

      cleanings.push({
        images: uniqueUrls,
        date: dateText || 'Date unavailable'
      });
    }

    console.log('GC Cleanings: parsed ' + cleanings.length + ' cleaning entries');
    if (cleanings.length > 0) {
      cleanings.forEach(function(c, i) {
        console.log('  Entry ' + (i+1) + ': ' + c.images.length + ' photos, date: ' + c.date);
      });
    }

    if (cleanings.length === 0 && attempt < MAX_ATTEMPTS) {
      setTimeout(scrapeCleanings, POLL_INTERVAL);
      return;
    }

    if (cleanings.length === 0) {
      console.log('GC Cleanings: no cleaning data found. Check that #' + SOURCE_BLOCK_ID + ' has rendered cards with images.');
      var track = document.getElementById('gcCleaningsTrack');
      if (track) track.innerHTML = '<div class="gc-cleanings-loading">No recent cleanings to display.</div>';
      return;
    }

    renderCarousel(cleanings);
  }

  /* ============================================================
     DATE FORMATTING
     ============================================================ */
  function formatCleaningDate(raw) {
    if (!raw) return '';

    // Try to parse various formats Softr might output
    var d;

    // Handle "Jul 23rd, 2026 07:57 AM" - remove ordinal suffixes
    var cleaned = raw.replace(/(\d+)(st|nd|rd|th)/gi, '$1');
    d = new Date(cleaned);

    if (isNaN(d.getTime())) {
      // Try ISO format
      d = new Date(raw);
    }

    if (isNaN(d.getTime())) {
      // Give up, return raw
      return raw;
    }

    var months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
    var hours = d.getHours();
    var minutes = d.getMinutes();
    var ampm = hours >= 12 ? 'pm' : 'am';
    hours = hours % 12 || 12;
    var minuteStr = minutes > 0 ? (':' + (minutes < 10 ? '0' : '') + minutes) : '';

    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() +
           ' at ' + hours + minuteStr + ampm;
  }

  /* ============================================================
     RENDERER - Builds the carousel HTML from scraped data
     ============================================================ */
  function renderCarousel(cleanings) {
    var track = document.getElementById('gcCleaningsTrack');
    if (!track) return;

    // Build per-entry image arrays for scoped lightbox navigation
    allEntryImages = [];
    cleanings.forEach(function(entry) {
      allEntryImages.push(entry.images.slice());
    });

    var html = '';

    cleanings.forEach(function(entry, entryIdx) {
      var imgs = entry.images;
      var heroSrc = imgs[0] || '';

      // Build thumbnails (up to MAX_THUMBS)
      var thumbCount = Math.min(imgs.length - 1, MAX_THUMBS);
      var overflow = imgs.length - 1 - MAX_THUMBS;

      var thumbsHtml = '';
      for (var i = 1; i <= thumbCount; i++) {
        var isLast = (i === thumbCount && overflow > 0);
        thumbsHtml += '<div class="gc-cleaning-thumb" data-lb-entry="' + entryIdx + '" data-lb-img="' + i + '">';
        thumbsHtml += '<img src="' + escHtml(imgs[i]) + '" alt="" loading="lazy">';
        if (isLast) {
          thumbsHtml += '<div class="gc-cleaning-overflow" data-lb-entry="' + entryIdx + '" data-lb-img="' + i + '">+' + overflow + '</div>';
        }
        thumbsHtml += '</div>';
      }

      // If only 1 image total, no thumbnails column
      var showThumbs = imgs.length > 1;

      html += '<div class="gc-cleaning-entry">';
      html += '<div class="gc-cleaning-photos"' + (!showThumbs ? ' style="gap:0"' : '') + '>';
      html += '<div class="gc-cleaning-hero" data-lb-entry="' + entryIdx + '" data-lb-img="0"><img src="' + escHtml(heroSrc) + '" alt="Cleaning photo" loading="lazy"></div>';
      if (showThumbs) {
        html += '<div class="gc-cleaning-thumbs">' + thumbsHtml + '</div>';
      }
      html += '</div>';
      html += '<div class="gc-cleaning-date">' + escHtml(entry.date) + '</div>';
      html += '</div>';
    });

    track.innerHTML = html;
    initNav();
    initLightbox();
    console.log('GC Cleanings: carousel rendered with ' + cleanings.length + ' entries');
  }

  function escHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /* ============================================================
     LIGHTBOX - Full-size photo overlay with prev/next
     ============================================================ */
  function initLightbox() {
    // Create overlay once
    if (!lightboxOverlay) {
      lightboxOverlay = document.createElement('div');
      lightboxOverlay.className = 'gc-lightbox-overlay';
      lightboxOverlay.innerHTML =
        '<div class="gc-lightbox-content">' +
          '<button class="gc-lightbox-close" aria-label="Close">&times;</button>' +
          '<button class="gc-lightbox-nav gc-lightbox-prev" aria-label="Previous photo">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
          '</button>' +
          '<img src="" alt="Cleaning photo full size">' +
          '<button class="gc-lightbox-nav gc-lightbox-next" aria-label="Next photo">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</button>' +
          '<div class="gc-lightbox-counter"></div>' +
        '</div>';
      document.body.appendChild(lightboxOverlay);

      // Close on overlay click (but not on image/button click)
      lightboxOverlay.addEventListener('click', function(e) {
        if (e.target === lightboxOverlay) closeLightbox();
      });
      lightboxOverlay.querySelector('.gc-lightbox-close').addEventListener('click', closeLightbox);
      lightboxOverlay.querySelector('.gc-lightbox-prev').addEventListener('click', function(e) {
        e.stopPropagation();
        if (lightboxIndex > 0) showLightboxImage(lightboxIndex - 1);
      });
      lightboxOverlay.querySelector('.gc-lightbox-next').addEventListener('click', function(e) {
        e.stopPropagation();
        if (lightboxIndex < lightboxImages.length - 1) showLightboxImage(lightboxIndex + 1);
      });
      // Keyboard nav
      document.addEventListener('keydown', function(e) {
        if (!lightboxOverlay.classList.contains('gc-lb-visible')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft' && lightboxIndex > 0) showLightboxImage(lightboxIndex - 1);
        else if (e.key === 'ArrowRight' && lightboxIndex < lightboxImages.length - 1) showLightboxImage(lightboxIndex + 1);
      });
    }

    // Wire click handlers on all carousel images
    var track = document.getElementById('gcCleaningsTrack');
    if (!track) return;
    track.addEventListener('click', function(e) {
      var target = e.target.closest('[data-lb-entry]');
      if (!target) return;
      var entryIdx = parseInt(target.getAttribute('data-lb-entry'), 10);
      var imgIdx = parseInt(target.getAttribute('data-lb-img'), 10);
      if (!isNaN(entryIdx) && !isNaN(imgIdx) && allEntryImages[entryIdx]) {
        lightboxImages = allEntryImages[entryIdx];
        openLightbox(imgIdx);
      }
    });
  }

  function openLightbox(index) {
    if (!lightboxOverlay || lightboxImages.length === 0) return;
    showLightboxImage(index);
    lightboxOverlay.style.display = 'flex';
    // Trigger reflow for transition
    lightboxOverlay.offsetHeight;
    lightboxOverlay.classList.add('gc-lb-visible');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    if (!lightboxOverlay) return;
    lightboxOverlay.classList.remove('gc-lb-visible');
    setTimeout(function() {
      lightboxOverlay.style.display = 'none';
      document.body.style.overflow = '';
    }, 250);
  }

  function showLightboxImage(index) {
    lightboxIndex = index;
    var img = lightboxOverlay.querySelector('.gc-lightbox-content img');
    var counter = lightboxOverlay.querySelector('.gc-lightbox-counter');
    var prevBtn = lightboxOverlay.querySelector('.gc-lightbox-prev');
    var nextBtn = lightboxOverlay.querySelector('.gc-lightbox-next');

    img.src = lightboxImages[index];
    counter.textContent = (index + 1) + ' / ' + lightboxImages.length;
    prevBtn.style.visibility = index > 0 ? 'visible' : 'hidden';
    nextBtn.style.visibility = index < lightboxImages.length - 1 ? 'visible' : 'hidden';
  }

  /* ============================================================
     NAVIGATION - Arrow buttons
     ============================================================ */
  function initNav() {
    var track = document.getElementById('gcCleaningsTrack');
    var leftBtn = document.querySelector('.gc-cleanings-nav--left');
    var rightBtn = document.querySelector('.gc-cleanings-nav--right');
    if (!track || !leftBtn || !rightBtn) return;

    var scrollAmount = 440;

    function updateButtons() {
      leftBtn.disabled = track.scrollLeft < 10;
      rightBtn.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 10;
    }

    leftBtn.addEventListener('click', function() {
      track.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
    });
    rightBtn.addEventListener('click', function() {
      track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
    });

    track.addEventListener('scroll', updateButtons);
    window.addEventListener('resize', updateButtons);

    // Initial state
    setTimeout(updateButtons, 100);
  }

  /* ============================================================
     KICK OFF - Start scraping after a short delay
     ============================================================ */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(scrapeCleanings, 1500);
    });
  } else {
    setTimeout(scrapeCleanings, 1500);
  }

})();
</script>
